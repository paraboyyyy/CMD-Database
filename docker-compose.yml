services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cmd
      POSTGRES_PASSWORD: cmd
      POSTGRES_DB: cmd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmd"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CMD_DATABASE_URL: postgresql+psycopg://cmd:cmd@db:5432/cmd
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
