name: Smoke test

# Checks that the live site and API answer correctly. Run it from the Actions tab after a deploy.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site URL"
        default: "https://cmd-database.vercel.app"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url }}
    steps:
      - name: Pages and API
        run: |
          set -u
          fail=0
          check() {  # path, expected status, expected text in body
            body=$(curl -sS -L -o /tmp/body -w "%{http_code} %{time_total}" "$URL$1") || { echo "FAIL $1 (connection)"; fail=1; return; }
            code=${body% *}; time=${body#* }
            if [ "$code" = "$2" ] && grep -q -- "$3" /tmp/body; then
              echo "ok   $code ${time}s  $1"
            else
              echo "FAIL $code ${time}s  $1 (expected $2 and '$3')"; head -c 400 /tmp/body; echo; fail=1
            fi
          }
          check /                                       200 'id="root"'
          check /viewer                                 200 'id="root"'
          check /api/health                             200 '"ok"'
          check "/api/materials?limit=1"                200 '"total"'
          # The rest uses whichever material comes first, so it works for any database contents.
          first=$(curl -sS "$URL/api/materials?limit=1")
          id=$(echo "$first" | python3 -c "import json,sys; print(json.load(sys.stdin)['items'][0]['id'])")
          formula=$(echo "$first" | python3 -c "import json,sys; print(json.load(sys.stdin)['items'][0]['formula_pretty'])")
          echo "first material: $id $formula"
          check "/materials/$id"                        200 'id="root"'
          check "/api/materials/$id"                    200 '"lattice"'
          check "/api/materials?formula=$formula"       200 "\"$id\""
          check "/api/materials/$id/download?fmt=cif"   200 '_cell_length_a'
          check "/api/materials/$id/download?fmt=poscar" 200 'Direct'
          check "/api/elements?with=O"                 200 '"counts"'
          check /api/spacegroups                        200 '"Fm-3m"'
          check /builder                                200 'id="root"'
          check /api/materials/does-not-exist           404 'not found'
          check /openapi.json                           200 'CMD Database API'
          check /docs                                   200 'swagger'
          exit $fail
      - name: Database contents
        if: always()
        run: |
          curl -sS "$URL/api/materials?limit=200" > /tmp/page.json
          python3 - <<'EOF'
          import collections, json
          page = json.load(open("/tmp/page.json"))
          sources = dict(collections.Counter(m["source"] for m in page["items"]))
          print(f"::notice title=Database::{page['total']} materials; by source (first 200): {sources}")
          EOF
      - name: Space group (spglib)
        run: |
          curl -sS -X POST "$URL/api/symmetry" -H 'content-type: application/json' -d '{
            "lattice": [[5.64,0,0],[0,5.64,0],[0,0,5.64]],
            "frac": [[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5],[0.5,0.5,0.5],[0,0,0.5],[0,0.5,0],[0.5,0,0]],
            "species": ["Na","Na","Na","Na","Cl","Cl","Cl","Cl"]}' | tee /tmp/sym
          echo
          grep -q '"spacegroup_number":225' /tmp/sym
      - name: Builder (space-group expansion)
        run: |
          curl -sS -X POST "$URL/api/build" -H 'content-type: application/json' -d '{
            "hall": 523, "lattice": {"a": 5.64, "b": 5.64, "c": 5.64, "alpha": 90, "beta": 90, "gamma": 90},
            "sites": [{"element": "Na", "frac": [0, 0, 0]}, {"element": "Cl", "frac": [0.5, 0.5, 0.5]}]}' | tee /tmp/build
          echo
          grep -q '"multiplicities":\[4,4\]' /tmp/build
      - name: Band path (seekpath)
        run: |
          curl -sS -X POST "$URL/api/kpath" -H 'content-type: application/json' -d '{
            "lattice": [[0,2.7155,2.7155],[2.7155,0,2.7155],[2.7155,2.7155,0]],
            "frac": [[0,0,0],[0.25,0.25,0.25]], "species": ["Si","Si"]}' | tee /tmp/kpath
          echo
          grep -q '"bravais_lattice":"cF' /tmp/kpath
